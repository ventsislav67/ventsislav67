<svg xmlns="http://www.w3.org/2000/svg" width="620" height="350" viewBox="0 0 620 350" role="img">
<title>Repository language distribution</title>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0C1D37"/><stop offset="1" stop-color="#061020"/></linearGradient>
<linearGradient id="line"><stop stop-color="#32BDFF"/><stop offset=".5" stop-color="#17F2C5"/><stop offset="1" stop-color="#8266FF"/></linearGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M 26 0 L 0 0 0 26" stroke="#2E4E6E" stroke-opacity=".22" fill="none"/></pattern>
</defs>
<style>
.blink{animation:blink 2.5s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:grow 850ms ease-out backwards}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes grow{from{transform:scaleY(.08);opacity:.2}to{transform:scaleY(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.blink,.bar{animation:none}}
</style>
<rect width="620" height="350" rx="22" fill="url(#bg)"/>
<rect width="620" height="350" rx="22" fill="url(#grid)"/>
<rect x="1" y="1" width="618" height="348" rx="21" fill="none" stroke="#1B668B"/>
<rect width="620" height="3" rx="1.5" fill="url(#line)"/>
<circle class="blink" cx="35" cy="38" r="5" fill="#13FDD9"/><text x="49" y="43" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#31E5F8" letter-spacing="1.5">LANGUAGE SPECTRUM</text><text x="35" y="68" font-family="Arial,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#95BED7" letter-spacing=".9">BY REPOSITORY CODE SIZE  /  NOT SKILL LEVEL</text><text x="36" y="96" font-family="Arial,Segoe UI,sans-serif" font-size="13" font-weight="750" fill="#ECF8FF" letter-spacing=".4">JAVASCRIPT</text><text x="578" y="96" font-family="Arial,Segoe UI,sans-serif" font-size="12" font-weight="750" fill="#37DBFF" text-anchor="end">41.69%</text><rect x="36" y="104" width="542" height="7" rx="3.5" fill="#1B3852"/><rect class="bar" x="36" y="104" width="226.0" height="7" rx="3.5" fill="#37DBFF" style="animation-delay:0ms"/><text x="36" y="133" font-family="Arial,Segoe UI,sans-serif" font-size="13" font-weight="750" fill="#ECF8FF" letter-spacing=".4">C#</text><text x="578" y="133" font-family="Arial,Segoe UI,sans-serif" font-size="12" font-weight="750" fill="#28E6C3" text-anchor="end">31.70%</text><rect x="36" y="141" width="542" height="7" rx="3.5" fill="#1B3852"/><rect class="bar" x="36" y="141" width="171.8" height="7" rx="3.5" fill="#28E6C3" style="animation-delay:80ms"/><text x="36" y="170" font-family="Arial,Segoe UI,sans-serif" font-size="13" font-weight="750" fill="#ECF8FF" letter-spacing=".4">PHP</text><text x="578" y="170" font-family="Arial,Segoe UI,sans-serif" font-size="12" font-weight="750" fill="#7F9BFF" text-anchor="end">17.93%</text><rect x="36" y="178" width="542" height="7" rx="3.5" fill="#1B3852"/><rect class="bar" x="36" y="178" width="97.2" height="7" rx="3.5" fill="#7F9BFF" style="animation-delay:160ms"/><text x="36" y="207" font-family="Arial,Segoe UI,sans-serif" font-size="13" font-weight="750" fill="#ECF8FF" letter-spacing=".4">HTML</text><text x="578" y="207" font-family="Arial,Segoe UI,sans-serif" font-size="12" font-weight="750" fill="#B99AFF" text-anchor="end">4.88%</text><rect x="36" y="215" width="542" height="7" rx="3.5" fill="#1B3852"/><rect class="bar" x="36" y="215" width="26.4" height="7" rx="3.5" fill="#B99AFF" style="animation-delay:240ms"/><text x="36" y="244" font-family="Arial,Segoe UI,sans-serif" font-size="13" font-weight="750" fill="#ECF8FF" letter-spacing=".4">CSS</text><text x="578" y="244" font-family="Arial,Segoe UI,sans-serif" font-size="12" font-weight="750" fill="#FFB56C" text-anchor="end">3.45%</text><rect x="36" y="252" width="542" height="7" rx="3.5" fill="#1B3852"/><rect class="bar" x="36" y="252" width="18.7" height="7" rx="3.5" fill="#FFB56C" style="animation-delay:320ms"/><text x="36" y="281" font-family="Arial,Segoe UI,sans-serif" font-size="13" font-weight="750" fill="#ECF8FF" letter-spacing=".4">PYTHON</text><text x="578" y="281" font-family="Arial,Segoe UI,sans-serif" font-size="12" font-weight="750" fill="#EE8FB8" text-anchor="end">0.35%</text><rect x="36" y="289" width="542" height="7" rx="3.5" fill="#1B3852"/><rect class="bar" x="36" y="289" width="2.0" height="7" rx="3.5" fill="#EE8FB8" style="animation-delay:400ms"/><text x="35" y="336" font-family="Arial,Segoe UI,sans-serif" font-size="10" font-weight="600" fill="#95BED7" letter-spacing=".7">GITHUB REPOSITORY LANGUAGES  •  REFRESHED AUTOMATICALLY</text></svg>
