<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="408" viewBox="0 0 1180 408" role="img" aria-labelledby="hudTitle hudDesc">
<title id="hudTitle">Ventsislav Kolev animated developer profile</title>
<desc id="hudDesc">A neon developer panel highlighting C#, Arduino, web development and automotive technology, with animated data traces and pulsing neon cards.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1A32"/><stop offset=".55" stop-color="#08162B"/><stop offset="1" stop-color="#060E20"/></linearGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#13BBFF"/><stop offset=".5" stop-color="#40FFD9"/><stop offset="1" stop-color="#9F84FF"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1ACBFF" stop-opacity="0"/><stop offset=".5" stop-color="#2CEAFF" stop-opacity=".20"/><stop offset="1" stop-color="#1ACBFF" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#3976A4" stroke-opacity=".14"/></pattern>
  <clipPath id="box"><rect width="1180" height="408" rx="22"/></clipPath>
</defs>
<g clip-path="url(#box)">
  <rect width="1180" height="408" rx="22" fill="url(#background)"/>
  <rect width="1180" height="408" fill="url(#grid)"/>
  <circle cx="405" cy="208" r="167" fill="none" stroke="#1B4B6C" stroke-opacity=".38"/>
  <circle cx="405" cy="208" r="109" fill="none" stroke="#2EDDFC" stroke-opacity=".13" stroke-dasharray="8 16">
    <animateTransform attributeName="transform" type="rotate" from="0 405 208" to="360 405 208" dur="38s" repeatCount="indefinite"/>
  </circle>
  <path d="M0 27H1180" stroke="#22617D" stroke-opacity=".6"/>
  <rect width="1180" height="3" fill="url(#stroke)"/>
  <rect x="-350" y="0" width="270" height="408" fill="url(#glow)">
    <animate attributeName="x" values="-350;1180" dur="12s" repeatCount="indefinite"/>
  </rect>
  <path d="M494 55V350" stroke="#24476B" stroke-dasharray="4 10" stroke-width="2"/>
  <path d="M495 55V350" stroke="#34E6FC" stroke-width="1.5" stroke-dasharray="45 295">
    <animate attributeName="stroke-dashoffset" values="40;-360" dur="5.8s" repeatCount="indefinite"/>
  </path>
  <rect x="1.5" y="1.5" width="1177" height="405" rx="20.5" fill="none" stroke="#286487" stroke-width="2"/>
  <text x="51" y="59" font-family="Consolas,monospace" fill="#45EEFF" font-size="14" font-weight="700" letter-spacing="2.4">DEVELOPER PROFILE  //  001</text>
  <circle cx="457" cy="54" r="4" fill="#33FFDB"><animate attributeName="r" values="3.3;6;3.3" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></circle>
  <text x="51" y="125" font-family="Segoe UI,Arial,sans-serif" fill="#A6C3DC" font-size="19" font-weight="600" letter-spacing="3">HELLO, I'M</text>
  <text x="46" y="193" font-family="Segoe UI,Arial,sans-serif" fill="#E9F9FF" font-size="53" font-weight="900" letter-spacing="2.7">VENTSISLAV</text>
  <text x="46" y="250" font-family="Segoe UI,Arial,sans-serif" fill="#44E9FF" font-size="53" font-weight="900" letter-spacing="3.8">KOLEV</text>
  <path d="M51 267H410" stroke="url(#stroke)" stroke-width="3" stroke-linecap="round"/>
  <rect x="49" y="282" width="416" height="74" rx="11" fill="#081B30" stroke="#2B5775" stroke-width="1.2"/>
  <circle cx="65" cy="299" r="3" fill="#40FFDC"/>
  <text x="77" y="303" font-family="Consolas,monospace" fill="#89AAC5" font-size="12.5">developer@github:~$</text>
  <text x="64" y="328" font-family="Consolas,monospace" fill="#E2FBFF" font-size="17" font-weight="700">build(); learn(); improve();</text>
  <rect x="347" y="312" width="11" height="20" rx="1" fill="#37F7D7"><animate attributeName="opacity" values="1;.1;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <text x="538" y="58" font-family="Consolas,monospace" fill="#A1C2DE" font-size="13" font-weight="700" letter-spacing="2">FOCUS AREAS  /  WHAT I BUILD</text>
  <g>
  <rect x="538" y="81" width="588" height="64" rx="13" fill="#0B1D33" stroke="#294565" stroke-width="1.2"/>
  <rect x="538" y="91" width="3.4" height="44" rx="1.7" fill="#30E5FF"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/></rect>
  <rect x="551" y="93" width="42" height="40" rx="10" fill="#142C46" stroke="#3A5D80" stroke-width=".8"/>
  <text x="572" y="119" text-anchor="middle" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#30E5FF">01</text>
  <text x="610" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="1.1" fill="#ECF7FF">SOFTWARE ENGINEERING</text>
  <text x="610" y="128" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#8FAECA">C#  /  .NET  /  Windows Forms</text>
  <circle cx="1101" cy="112" r="4.3" fill="#30E5FF"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
</g>
<g>
  <rect x="538" y="154" width="588" height="64" rx="13" fill="#0B1D33" stroke="#294565" stroke-width="1.2"/>
  <rect x="538" y="164" width="3.4" height="44" rx="1.7" fill="#43FFD7"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" repeatCount="indefinite"/></rect>
  <rect x="551" y="166" width="42" height="40" rx="10" fill="#142C46" stroke="#3A5D80" stroke-width=".8"/>
  <text x="572" y="192" text-anchor="middle" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#43FFD7">02</text>
  <text x="610" y="181" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="1.1" fill="#ECF7FF">EMBEDDED SYSTEMS</text>
  <text x="610" y="201" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#8FAECA">Arduino  /  Sensors  /  LCD  /  RGB</text>
  <circle cx="1101" cy="185" r="4.3" fill="#43FFD7"><animate attributeName="opacity" values=".25;1;.25" dur="2.65s" repeatCount="indefinite"/></circle>
</g>
<g>
  <rect x="538" y="227" width="588" height="64" rx="13" fill="#0B1D33" stroke="#294565" stroke-width="1.2"/>
  <rect x="538" y="237" width="3.4" height="44" rx="1.7" fill="#A891FF"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="551" y="239" width="42" height="40" rx="10" fill="#142C46" stroke="#3A5D80" stroke-width=".8"/>
  <text x="572" y="265" text-anchor="middle" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#A891FF">03</text>
  <text x="610" y="254" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="1.1" fill="#ECF7FF">WEB DEVELOPMENT</text>
  <text x="610" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#8FAECA">HTML  /  CSS  /  JavaScript  /  Firebase</text>
  <circle cx="1101" cy="258" r="4.3" fill="#A891FF"><animate attributeName="opacity" values=".25;1;.25" dur="3.3s" repeatCount="indefinite"/></circle>
</g>
<g>
  <rect x="538" y="300" width="588" height="64" rx="13" fill="#0B1D33" stroke="#294565" stroke-width="1.2"/>
  <rect x="538" y="310" width="3.4" height="44" rx="1.7" fill="#FFC788"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.4s" repeatCount="indefinite"/></rect>
  <rect x="551" y="312" width="42" height="40" rx="10" fill="#142C46" stroke="#3A5D80" stroke-width=".8"/>
  <text x="572" y="338" text-anchor="middle" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#FFC788">04</text>
  <text x="610" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="1.1" fill="#ECF7FF">AUTOMOTIVE TECH</text>
  <text x="610" y="347" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#8FAECA">Connected cars  /  Electronics  /  UX</text>
  <circle cx="1101" cy="331" r="4.3" fill="#FFC788"><animate attributeName="opacity" values=".25;1;.25" dur="3.95s" repeatCount="indefinite"/></circle>
</g>
  <text x="51" y="384" font-family="Consolas,monospace" font-size="12" fill="#779FC3" letter-spacing="1.1">LEARN. BUILD. IMPROVE. REPEAT.</text>
  <text x="1125" y="384" text-anchor="end" font-family="Consolas,monospace" font-size="12" fill="#91C8D9">SCROLL DOWN TO EXPLORE ⌄
    <animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/>
  </text>
</g>
</svg>
