name: Refresh animated GitHub dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/profile-visuals.yml'
      - 'scripts/render_dashboard.py'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Fetch verified GitHub metrics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ventsislav67&show_icons=true&hide_border=true&hide_rank=true&bg_color=08162A&title_color=37DFFF&text_color=DDEEFF&icon_color=00C9F4
          path: github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Fetch repository language distribution
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ventsislav67&layout=compact&langs_count=6&hide_border=true&bg_color=08162A&title_color=37DFFF&text_color=DDEEFF
          path: top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Render animated neon dashboard and contribution chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_dashboard.py

      - name: Animate actual contribution calendar
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ventsislav67
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            github-snake-dark.svg?palette=github-dark&color_snake=#00DEFF&color_dots=#0B1220,#0E456A,#135E8F,#1A9CC1,#62E9F7
            github-snake-light.svg?palette=github-light&color_snake=#0077BB&color_dots=#F1F7FD,#BCDDF4,#7EBEEE,#4C8BC7,#135E9A

      - name: Commit only changed images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-stats.svg top-languages.svg developer-stats.svg developer-languages.svg contribution-signal.svg github-snake-dark.svg github-snake-light.svg
          if git diff --cached --quiet; then
            echo 'Everything is already up to date.'
            exit 0
          fi
          git commit -m 'chore(profile): sync animated metrics [skip ci]'
          git push
