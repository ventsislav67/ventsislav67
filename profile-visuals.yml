name: Refresh profile stats and animated contributions

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  push:
    paths:
      - '.github/workflows/profile-visuals.yml'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Ensure assets directory exists
        run: mkdir -p assets

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ventsislav67&show_icons=true&hide_border=true&hide_rank=true&bg_color=08162A&title_color=37DFFF&text_color=DDEEFF&icon_color=00C9F4
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate GitHub top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ventsislav67&layout=compact&langs_count=7&hide_border=true&bg_color=08162A&title_color=37DFFF&text_color=DDEEFF
          path: assets/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Animate GitHub contributions (dark and light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ventsislav67
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#00DEFF&color_dots=#0B1220,#0E456A,#135E8F,#1A9CC1,#62E9F7
            assets/github-snake-light.svg?palette=github-light&color_snake=#0077BB&color_dots=#F1F7FD,#BCDDF4,#7EBEEE,#4C8BC7,#135E9A

      - name: Commit refreshed visualizations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/top-languages.svg assets/github-snake-dark.svg assets/github-snake-light.svg
          if git diff --cached --quiet; then
            echo 'No visual changes to commit.'
            exit 0
          fi
          git commit -m 'chore(profile): refresh live visuals [skip ci]'
          git push
